<!doctype html>
<!-- Source of banner.png (1280x640, rendered at 2x). Edit, then re-render with a browser screenshot of #banner. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap">
<style>
  html, body { margin: 0; background: #0b1226; }
  #banner { width: 1280px; height: 640px; display: block; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
  .sans { font-family: "Pretendard Variable", Pretendard, sans-serif; }
</style>
</head>
<body>
<svg id="banner" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#93a5ff" stroke-opacity="0.06"/>
    </pattern>
    <pattern id="grid-major" width="160" height="160" patternUnits="userSpaceOnUse">
      <path d="M160 0H0V160" fill="none" stroke="#93a5ff" stroke-opacity="0.1"/>
    </pattern>
    <radialGradient id="glow" cx="0.74" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#3b5bdb" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#3b5bdb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sea" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4c6ef5" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#4c6ef5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="#0b1226"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#grid-major)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- wordmark -->
  <text x="96" y="214" class="mono" font-size="17" letter-spacing="3.4" fill="#91a7ff">REACT · NEXT · NEST · ASTRO · FLUTTER</text>
  <text x="90" y="324" class="sans" font-size="132" font-weight="800" letter-spacing="-5" fill="#ffffff">Slipway</text>
  <text x="96" y="384" class="sans" font-size="32" font-weight="500" letter-spacing="-0.5" fill="#c3cbe6">제품까지 가는 셋업 코드</text>
  <g class="mono" font-size="15" fill="#c3cbe6">
    <rect x="96" y="420" width="112" height="34" rx="17" fill="none" stroke="#93a5ff" stroke-opacity="0.35"/>
    <text x="152" y="442" text-anchor="middle">화면 부품</text>
    <rect x="218" y="420" width="132" height="34" rx="17" fill="none" stroke="#93a5ff" stroke-opacity="0.35"/>
    <text x="284" y="442" text-anchor="middle">Mock ⇄ API</text>
    <rect x="360" y="420" width="112" height="34" rx="17" fill="none" stroke="#93a5ff" stroke-opacity="0.35"/>
    <text x="416" y="442" text-anchor="middle">AI 하네스</text>
  </g>

  <!-- slipway: ground, supports, rails -->
  <line x1="560" y1="584" x2="1060" y2="584" stroke="#93a5ff" stroke-opacity="0.35" stroke-dasharray="6 8"/>
  <g stroke="#93a5ff" stroke-opacity="0.45" stroke-width="2">
    <line x1="640" y1="443" x2="640" y2="584"/>
    <line x1="720" y1="454" x2="720" y2="584"/>
    <line x1="800" y1="464" x2="800" y2="584"/>
    <line x1="880" y1="475" x2="880" y2="584"/>
    <line x1="960" y1="485" x2="960" y2="584"/>
    <line x1="1040" y1="496" x2="1040" y2="584"/>
  </g>
  <line x1="590" y1="436" x2="1280" y2="527" stroke="#c5d0ff" stroke-width="4" stroke-linecap="round"/>
  <line x1="590" y1="450" x2="1280" y2="541" stroke="#93a5ff" stroke-opacity="0.5" stroke-width="2"/>

  <!-- sea -->
  <ellipse cx="1200" cy="600" rx="200" ry="96" fill="url(#sea)"/>
  <g fill="none" stroke="#91a7ff" stroke-width="3" stroke-linecap="round">
    <path d="M1060 512 q15 -10 30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0" stroke-opacity="0.9"/>
    <path d="M1090 548 q15 -10 30 0 t30 0 t30 0 t30 0 t30 0 t30 0" stroke-opacity="0.45"/>
    <path d="M1130 584 q15 -10 30 0 t30 0 t30 0 t30 0 t30 0" stroke-opacity="0.2"/>
    <path d="M1170 620 q15 -10 30 0 t30 0 t30 0 t30 0" stroke-opacity="0.1"/>
  </g>

  <!-- ship on the rails, tilted with the slope -->
  <g transform="translate(905 476) rotate(7.5) translate(0 -120)">
    <!-- cradle -->
    <path d="M-80 120 l14 -14 h28 l14 14 Z M60 120 l14 -14 h28 l14 14 Z" fill="#93a5ff" fill-opacity="0.55"/>

    <!-- cargo: code parts -->
    <g>
      <rect x="-150" y="-6" width="92" height="66" rx="8" fill="#4c6ef5"/>
      <rect x="-138" y="8" width="68" height="6" rx="3" fill="#fff" fill-opacity="0.95"/>
      <rect x="-138" y="22" width="68" height="4" rx="2" fill="#fff" fill-opacity="0.55"/>
      <rect x="-138" y="32" width="68" height="4" rx="2" fill="#fff" fill-opacity="0.55"/>
      <rect x="-138" y="42" width="48" height="4" rx="2" fill="#fff" fill-opacity="0.55"/>

      <rect x="-140" y="-64" width="74" height="54" rx="8" fill="#748ffc"/>
      <rect x="-128" y="-30" width="10" height="12" rx="2" fill="#fff" fill-opacity="0.9"/>
      <rect x="-113" y="-42" width="10" height="24" rx="2" fill="#fff" fill-opacity="0.9"/>
      <rect x="-98" y="-36" width="10" height="18" rx="2" fill="#fff" fill-opacity="0.9"/>
      <rect x="-83" y="-50" width="10" height="32" rx="2" fill="#fff" fill-opacity="0.9"/>

      <rect x="96" y="2" width="78" height="58" rx="8" fill="#5c7cfa"/>
      <rect x="107" y="14" width="56" height="10" rx="3" fill="#fff" fill-opacity="0.9"/>
      <rect x="107" y="30" width="56" height="10" rx="3" fill="#fff" fill-opacity="0.55"/>
      <rect x="135" y="45" width="28" height="8" rx="3" fill="#ffd43b"/>
    </g>

    <!-- otter -->
    <g transform="translate(18 0)">
      <ellipse cx="0" cy="44" rx="46" ry="54" fill="#9c6644"/>
      <ellipse cx="0" cy="52" rx="28" ry="38" fill="#f3dcc0"/>
      <!-- arm with wrench -->
      <path d="M34 34 L58 -4" stroke="#9c6644" stroke-width="20" stroke-linecap="round"/>
      <g transform="translate(60 -6) rotate(24)">
        <rect x="-6" y="-70" width="12" height="70" rx="6" fill="#dbe1f0"/>
        <path d="M-20 -88 a20 20 0 1 0 40 0 l-10 0 l0 12 l-20 0 l0 -12 Z" fill="#dbe1f0"/>
      </g>
      <circle cx="58" cy="-4" r="12" fill="#8a5a3a"/>
      <!-- head -->
      <circle cx="-34" cy="-34" r="10" fill="#8a5a3a"/>
      <circle cx="34" cy="-34" r="10" fill="#8a5a3a"/>
      <circle cx="0" cy="-32" r="40" fill="#9c6644"/>
      <ellipse cx="0" cy="-16" rx="31" ry="23" fill="#f3dcc0"/>
      <circle cx="-14" cy="-36" r="5.5" fill="#141a33"/>
      <circle cx="14" cy="-36" r="5.5" fill="#141a33"/>
      <circle cx="-12" cy="-38" r="1.8" fill="#fff"/>
      <circle cx="16" cy="-38" r="1.8" fill="#fff"/>
      <ellipse cx="-23" cy="-19" rx="6" ry="3.5" fill="#f08c8c" fill-opacity="0.55"/>
      <ellipse cx="23" cy="-19" rx="6" ry="3.5" fill="#f08c8c" fill-opacity="0.55"/>
      <ellipse cx="0" cy="-22" rx="8" ry="5.5" fill="#141a33"/>
      <path d="M-7 -13 q3.5 5 7 0 q3.5 5 7 0" fill="none" stroke="#141a33" stroke-width="2.2" stroke-linecap="round"/>
      <g stroke="#141a33" stroke-opacity="0.55" stroke-width="1.6" stroke-linecap="round">
        <line x1="-16" y1="-18" x2="-36" y2="-22"/>
        <line x1="-16" y1="-14" x2="-36" y2="-12"/>
        <line x1="16" y1="-18" x2="36" y2="-22"/>
        <line x1="16" y1="-14" x2="36" y2="-12"/>
      </g>
      <!-- hard hat -->
      <path d="M-36 -52 Q-36 -92 0 -94 Q36 -92 36 -52 Z" fill="#ffd43b"/>
      <rect x="-46" y="-56" width="92" height="10" rx="5" fill="#fcc419"/>
      <rect x="-5" y="-92" width="10" height="38" rx="5" fill="#fcc419"/>
    </g>

    <!-- hull -->
    <path d="M-170 60 H200 L168 120 H-146 Z" fill="#eef1ff"/>
    <rect x="-164" y="74" width="356" height="12" fill="#3b5bdb"/>
    <circle cx="-110" cy="100" r="6" fill="#c5d0ff"/>
    <circle cx="-84" cy="100" r="6" fill="#c5d0ff"/>
    <!-- paw on the rim -->
    <ellipse cx="-22" cy="60" rx="14" ry="10" fill="#8a5a3a"/>
  </g>
</svg>
</body>
</html>
