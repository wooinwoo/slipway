# Every push to main and pull request: the path CONTRIBUTING.md gives contributors (bootstrap, then
# `pnpm verify` over every template) and the Flutter shell's checks. Failed runs attach screenshots and traces.
name: verify
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  templates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: templates/*/pnpm-lock.yaml
      - run: pnpm run bootstrap
      - run: pnpm --dir templates/react exec playwright install-deps firefox
      - run: pnpm verify
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reports
          path: |
            templates/**/.shots
            templates/**/test-results
            !**/node_modules/**
          if-no-files-found: ignore
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: templates/flutter
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
