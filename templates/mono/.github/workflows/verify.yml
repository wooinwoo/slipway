# Every push and pull request: `pnpm verify` across shared, API and web (the web e2e runs against a fresh
# API and against the mock), then the web score (Lighthouse needs Chrome, which the runner has) and the audit.
name: verify
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @slipway/web exec playwright install --with-deps firefox
      - run: pnpm verify
      - run: pnpm --filter @slipway/web check:score
      - run: pnpm audit:deps
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            apps/web/.shots
            apps/web/.lighthouseci
            apps/web/test-results
          if-no-files-found: ignore
